[package]
name = "komo-config"
version = "0.1.0"
edition = "2024"

[features]
# Test-only constructors dependent crates' tests need. Enabled as a
# dev-dependency only, so they never ship.
test-support = []

[dependencies]
komo-core = { path = "../komo-core" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
# `KOMO_*` environment overrides, the highest-precedence config source.
envy = { workspace = true }
uuid = { workspace = true }
# Expands a `~/` vault path against the real home (not KOMO_HOME).
dirs = { workspace = true }
