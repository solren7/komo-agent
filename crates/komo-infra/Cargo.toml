[package]
name = "komo-infra"
version = "0.1.0"
edition = "2024"

[features]
# Lets a dependent crate's tests reuse `persistence::reset_test_db`; off in
# every real build, so the helper does not ship.
test-support = []

[dependencies]
komo-core = { path = "../komo-core" }
komo-config = { path = "../komo-config" }
# `codex.rs` stamps the OAuth token onto requests through the provider layer's
# `TokenSource` hook.
komo-provider = { path = "../komo-provider" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
tokio = { version = "1.53.1", features = ["full"] }
# Persistence: toasty over Turso (see the Turso/toasty invariants in AGENTS.md).
toasty = { version = "0.10.0", features = ["sqlite", "turso"] }
toasty-driver-turso = "0.10.0"
turso = "0.7.2"
# Decodes the Codex OAuth access-token JWT payload (no signature verification).
base64 = "0.23.0"
# Header constants for the Codex OAuth refresh request.
http = "1.5.0"
# Reads the Codex CLI's own config.toml to resolve its auth file.
toml = { workspace = true }
